# Kitty appearance

# Fonts are selected by family/style instead of a per-user file path. Install
# them into ~/.local/share/fonts and run fc-cache if necessary.
font_family family="Liga SFMono Nerd Font" style=Medium
bold_font family="Liga SFMono Nerd Font" style=Bold
italic_font family="Liga SFMono Nerd Font" style="Medium Italic"
bold_italic_font family="Liga SFMono Nerd Font" style="Bold Italic"
font_size 12

foreground #c9c7cd
background #101012

selection_foreground #101012
selection_background #c9c7cd
cursor #c9c7cd
cursor_text_color #101012
url_color #83aeb2

color0 #29292c
color8 #55555d
color1 #d18f85
color9 #d99b91
color2 #83a994
color10 #91b9a3
color3 #cba98f
color11 #d7b69f
color4 #a399c5
color12 #b0a6ce
color5 #cc91b6
color13 #d6a1c4
color6 #83aeb2
color14 #9bc0c2
color7 #bdbbc9
color15 #cac8d2

window_padding_width 9
hide_window_decorations yes
tab_bar_style hidden
enable_audio_bell no
scrollback_lines 1000
