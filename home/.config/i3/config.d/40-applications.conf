# Application launchers and menus.

# start a terminal
bindsym $mod+Return exec kitty

# app launcher and menus
# i3 is always X11; strip any stale Wayland env inherited from a previous
# niri session so rofi (and every app it launches) uses the X11 backend.
bindsym $mod+d exec --no-startup-id env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 XDG_CURRENT_DESKTOP=i3 QT_QPA_PLATFORM=xcb rofi -show drun
bindsym $mod+e exec --no-startup-id ~/.config/scripts/powermenu.sh
bindsym $mod+Shift+period exec --no-startup-id ~/.config/scripts/emoji.sh
