# Application launchers and menus.

# start a terminal
bindsym $mod+Return exec kitty

# app launcher and menus
bindsym $mod+d exec --no-startup-id rofi -show drun

# clipboard history (searchable, rofi)
bindsym $mod+p exec --no-startup-id ~/.config/scripts/clipboard.sh

bindsym $mod+e exec --no-startup-id ~/.config/scripts/powermenu.sh
bindsym $mod+Shift+period exec --no-startup-id ~/.config/scripts/emoji.sh
