# Media keys (PipeWire via wpctl and the shared volume script).

set $refresh_i3status pkill -SIGUSR1 i3status

# Volume up/down unmute first, same as scrolling the volume module.
bindsym XF86AudioRaiseVolume exec --no-startup-id env VOLUME_STEP=10 ~/.config/scripts/volume.sh up
bindsym XF86AudioLowerVolume exec --no-startup-id env VOLUME_STEP=10 ~/.config/scripts/volume.sh down
bindsym XF86AudioMute exec --no-startup-id ~/.config/scripts/volume.sh toggle
bindsym XF86AudioMicMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && $refresh_i3status
