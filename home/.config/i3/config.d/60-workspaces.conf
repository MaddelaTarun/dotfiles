# Workspaces: names, app → workspace assignments, switching and moving.

# Define names for default workspaces for which we configure key bindings later on.
# We use variables to avoid repeating the names in multiple places.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# ── app → workspace assignments ───────────────────────────────────────────────
# Windows always land on their home workspace, no matter which workspace you
# launch them from (e.g. Helium picked in rofi while on ws3 still goes to ws1).
assign [class="(?i)^helium$"]                    $ws1
assign [class="(?i)^kitty$"]                     $ws2
assign [class="(?i)^spotify$"]                   $ws3
assign [class="(?i)^vesktop$"]                   $ws3
assign [class="(?i)^(md\.obsidian\.)?obsidian$"] $ws3
assign [class="(?i)^obs$"]                       $ws4

# `assign` alone leaves you on the current workspace; follow the window so
# launching an app from rofi visibly takes you to its home workspace.
for_window [class="(?i)^helium$"]                    workspace $ws1
for_window [class="(?i)^kitty$"]                     workspace $ws2
for_window [class="(?i)^spotify$"]                   workspace $ws3
for_window [class="(?i)^vesktop$"]                   workspace $ws3
for_window [class="(?i)^(md\.obsidian\.)?obsidian$"] workspace $ws3
for_window [class="(?i)^obs$"]                       workspace $ws4

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# switch workspace (vim style: u = next/down, i = prev/up)
bindsym $mod+u workspace next
bindsym $mod+i workspace prev
bindsym $mod+Page_Down workspace next
bindsym $mod+Page_Up workspace prev

# move focused container to next/previous workspace (vim style)
bindsym $mod+Ctrl+u move container to workspace next
bindsym $mod+Ctrl+i move container to workspace prev
bindsym $mod+Ctrl+Page_Down move container to workspace next
bindsym $mod+Ctrl+Page_Up move container to workspace prev
