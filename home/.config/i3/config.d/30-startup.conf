# Programs and one-shot settings started with i3.

exec_always --no-startup-id xrandr --output HDMI-0 --mode 1920x1080 --rate 100

# X resources (cursor theme/size for Xlib, Qt and Chromium/Electron clients);
# must run before the applications below so they pick the values up.
exec_always --no-startup-id sh -c '[ -f ~/.Xresources ] && xrdb -merge ~/.Xresources'

exec --no-startup-id dex -a --environment i3

# Flatpak apps have their own XDG_CONFIG_HOME, so GTK inside the sandbox does
# not see ~/.config/gtk-*/settings.ini; mirror the host cursor settings into
# each app (Electron apps resolve their cursor through GTK).
exec --no-startup-id sh -c 'command -v flatpak >/dev/null && exec ~/.config/scripts/flatpak-gtk-settings.sh'
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock --nofork
exec --no-startup-id nm-applet

# compositor (config: ~/.config/picom/picom.conf). Guarded so an i3 restart
# doesn't spawn a second instance while the first one is still running.
exec --no-startup-id sh -c 'pgrep -x picom >/dev/null || exec picom'

# clipboard history daemon, queried by rofi through ~/.config/scripts/clipboard.sh
exec --no-startup-id sh -c 'command -v greenclip >/dev/null && { pgrep -x greenclip >/dev/null || exec greenclip daemon; }'

# screenshots: flameshot runs in the background and shows a tray icon. Its
# config uses native X11 capture (useX11LegacyScreenshot), because the
# freedesktop portal does not provide the Screenshot interface on i3.
exec --no-startup-id sh -c 'command -v flameshot >/dev/null && { pgrep -x flameshot >/dev/null || exec flameshot; }'

# wallpaper (re-applied on every reload/start)
exec_always --no-startup-id sh -c 'feh --no-fehbg --bg-fill "/home/t/Pictures/Wallpapers/mono/corey-oconnell-vnzIDV-dZkM-unsplash.jpg"'

# keyboard repeat: delay 200 ms, rate 35/s
exec_always --no-startup-id xset r rate 200 35
exec --no-startup-id numlockx on
