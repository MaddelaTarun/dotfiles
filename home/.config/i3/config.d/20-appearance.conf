# Look & feel: font, gaps, borders, colors, default layout.

font pango:Liga SFMono Nerd Font Medium 10

# no gaps: windows touch the screen edges and each other
gaps inner 0
gaps outer 0
smart_gaps off

# 2px pixel border (no titlebar) so the focused window is always visible,
# even when it is the only window on the workspace.
default_border pixel 2
default_floating_border pixel 2

# Some apps (GTK/CSD) ask the WM for no decorations; force our border anyway
# so the focused window is always identifiable.
for_window [class=".*"] border pixel 2

# border colors (neutral greys: #dbdbdb active, #2a2a2a inactive)
#                          border  background text    indicator child_border
client.focused          #dbdbdb #0f0f0f #dbdbdb #dbdbdb #dbdbdb
client.focused_inactive #2a2a2a #0f0f0f #888888 #2a2a2a #2a2a2a
client.unfocused        #2a2a2a #0f0f0f #888888 #2a2a2a #2a2a2a
client.urgent           #ff5555 #0f0f0f #ffffff #ff5555 #ff5555
client.background       #0f0f0f

# new workspaces start in tabbed layout (same as $mod+w)
workspace_layout tabbed
