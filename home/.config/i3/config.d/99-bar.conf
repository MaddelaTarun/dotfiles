# i3bar (with i3status) and its mouse bindings.

bar {
    status_command i3status
    separator_symbol " "

    bindsym button4 exec --no-startup-id wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+ && pkill -SIGUSR1 i3status
    bindsym button5 exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- && pkill -SIGUSR1 i3status
    bindsym button2 exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && pkill -SIGUSR1 i3status
}
