# i3bar (with i3status) and its mouse bindings.

bar {
    status_command i3status
    separator_symbol " "

    # system tray (flameshot and other tray apps); HDMI-0 is the primary output
    tray_output primary

    # scroll up/down: unmute (if needed) and adjust the volume
    bindsym button4 exec --no-startup-id ~/.config/scripts/volume.sh up
    bindsym button5 exec --no-startup-id ~/.config/scripts/volume.sh down

    # middle-click: mute; clicking again while muted unmutes and raises one step
    # (i3bar has no per-block clicks, so button1 stays reserved for workspaces)
    bindsym button2 exec --no-startup-id ~/.config/scripts/volume.sh press
}
