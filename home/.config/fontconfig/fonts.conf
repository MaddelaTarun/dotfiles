<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Make Liga SFMono Nerd Font the default UI font everywhere. -->

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Liga SFMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Liga SFMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liga SFMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Liga SFMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Qt asks for "Sans Serif"; fontconfig treats it as its own name -->
  <alias binding="strong">
    <family>Sans Serif</family>
    <prefer><family>Liga SFMono Nerd Font</family></prefer>
  </alias>

  <!-- Common hard-coded desktop fonts (GTK/Qt/GNOME defaults) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>

  <!-- Remap previously configured fonts so anything still asking for them
       gets Liga SFMono Nerd Font instead. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Lilex Nerd Font Propo</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Lilex Nerd Font</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Hasklug Nerd Font Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Hasklug Nerd Font</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>CommitMono Nerd Font Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liga SFMono Nerd Font</string>
    </edit>
  </match>

  <!-- Do not remap Noto Sans / DejaVu Sans: fontconfig uses them as
       fallback fonts for scripts that the main fonts do not cover. -->

  <!-- Put the color emoji font in every fallback chain so emoji are used
       instead of monochrome symbols from Font Awesome. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
