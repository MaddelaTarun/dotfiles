[preferred]
# niri only needs the GNOME backend for screencasting/screenshots.
default=gnome;gtk;
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=gnome;

# Everything user-facing should use the GTK backend. Do NOT let GNOME handle
# file dialogs: xdg-desktop-portal-gnome >= 47 delegates them to Nautilus,
# which is not installed.
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.AppChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
